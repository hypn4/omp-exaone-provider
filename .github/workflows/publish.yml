name: Publish to npm

# One-time npm setup:
# Create the package through an authenticated local publish, then configure
# a GitHub trusted publisher for this repository, publish.yml, environment npm.
# Enable Allow npm publish. The first OIDC publish must succeed within 2 days
# of creating the trust configuration. Every release needs a new npm version.
# https://docs.npmjs.com/trusted-publishers/

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  check:
    if: ${{ !github.event.release.prerelease }}
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    if: ${{ !github.event.release.prerelease && !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/omp-exaone-provider
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate the release tag and repository
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          if (!/^\d+\.\d+\.\d+$/.test(pkg.version) || process.env.RELEASE_TAG !== `v${pkg.version}`) {
            throw new Error("The stable release tag must match v<package.json version>.");
          }
          const repository = `git+https://github.com/${process.env.GITHUB_REPOSITORY}.git`;
          if (pkg.repository?.url !== repository) {
            throw new Error("package.json repository.url must match the publishing repository.");
          }
          NODE

      # The publish job installs no project dependencies and runs no lifecycle scripts.
      # npm uses OIDC and automatically generates provenance for this public package.
      - name: Publish with trusted publishing
        run: npm publish --ignore-scripts
